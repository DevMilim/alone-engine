[package]
name = "alone-engine"
version = "0.2.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["macros"]

[dependencies]
image = "0.25.10"
indexmap = "2.14.0"
macros = { version = "0.1.0", path = "macros" }
pixels = "0.17.2"
rodio = "0.22.2"
uuid = { version = "1.24.1", features = ["serde", "v7"] }
winit = "0.30.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rustc-hash = "2.1.3"
thiserror = "2.0.20"
bincode = "2"
bytes = "1.12.1"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
rayon = "1.12.0"
